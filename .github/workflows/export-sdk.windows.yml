name: Build Full Windows Development SDK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAFT_ROOT: C:\CraftRoot
  CRAFT_ABI: windows-cl-msvc2022-x86_64
  CRAFT_BINARY_CACHE: ${{ github.workspace }}\craft-binary-cache
  CRAFT_SHELF: ${{ github.workspace }}\wunjo-windows.craft.shelf

defaults:
  run:
    shell: pwsh

jobs:
  dependency-sdk:
    name: Build complete local Wunjo SDK
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout Wunjo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Clean conflicting tools from PATH
        run: |
          $ErrorActionPreference = 'Stop'

          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and
            $_ -notmatch 'Strawberry' -and
            $_ -notmatch 'Git\\bin'
          }) -join ';'

          "PATH=$env:PATH" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          foreach ($tool in 'sh', 'gcc', 'g++', 'cpp') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "${tool}: $($cmd.Source)"
            } else {
              Write-Host "${tool}: removed"
            }
          }

          Write-Host "git: $((Get-Command git).Source)"

      - name: Fetch and prepare KDE Craft
        run: |
          $ErrorActionPreference = 'Stop'

          Invoke-WebRequest `
            -Uri https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py `
            -OutFile CraftBootstrap.py

          git clone --depth 1 --branch master `
            https://github.com/KDE/craft.git craft-src
          if ($LASTEXITCODE -ne 0) {
            throw 'Craft clone failed.'
          }

          # Enable readable CI output during bootstrap only.
          $template = 'craft-src\CraftSettings.ini.template'
          $lines = Get-Content $template
          $section = ''

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[(.+)\]\s*$') {
              $section = $matches[1]
            } elseif (
              $section -eq 'ContinuousIntegration' -and
              $lines[$i] -match '^Enabled\s*='
            ) {
              $lines[$i] = 'Enabled = True'
              break
            }
          }

          Set-Content $template $lines -Encoding utf8

          # Match the working package workflow's gettext workaround.
          $recipe = 'craft-src\blueprints\libs\gettext\gettext.py'
          $source = Get-Content $recipe

          if (-not ($source | Select-String -SimpleMatch '-liconv')) {
            $patched = $false
            $output = foreach ($line in $source) {
              $line
              if ($line -eq '        self.shell.useMSVCCompatEnv = True') {
                '        self.subinfo.options.configure.ldflags += " -liconv"'
                $patched = $true
              }
            }

            if (-not $patched) {
              throw 'Craft gettext recipe changed; review the reference workaround.'
            }

            Set-Content $recipe $output -Encoding utf8
          }

      - name: Verify Visual Studio 2022
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = 'craft-src\bin\3rdparty\vswhere\vswhere.exe'
          $installation = & $vswhere `
            -property installationPath `
            -nologo `
            -latest `
            -products '*' `
            -version '[17,18)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64

          if ($LASTEXITCODE -ne 0 -or -not $installation) {
            throw 'Visual Studio 2022 C++ tools were not found.'
          }

          Write-Host "Visual Studio: $installation"

      - name: Bootstrap Craft for MSVC 2022
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:ANDROID_SDK_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:ANDROID_HOME -ErrorAction SilentlyContinue

          python CraftBootstrap.py `
            --prefix $env:CRAFT_ROOT `
            --branch master `
            --use-defaults `
            --localDev craft-src

          if ($LASTEXITCODE -ne 0) {
            throw 'Craft bootstrap failed.'
          }

      - name: Validate ABI and configure Craft
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force `
            -Path $env:CRAFT_BINARY_CACHE | Out-Null

          @'
          import configparser
          import os
          from pathlib import Path

          settings = Path(os.environ["CRAFT_ROOT"]) / "etc/CraftSettings.ini"
          if not settings.is_file():
              raise SystemExit(f"Missing Craft settings: {settings}")

          config = configparser.RawConfigParser()
          config.optionxform = str
          with settings.open(encoding="utf-8-sig") as handle:
              config.read_file(handle)

          expected = os.environ["CRAFT_ABI"]
          actual = config.get("General", "ABI", fallback="").strip()
          if actual != expected:
              raise SystemExit(
                  f"Craft ABI is {actual!r}; expected {expected!r}. "
                  "Do not relabel an incompatible installation."
              )

          values = {
              "Compile": {
                  "BuildType": "RelWithDebInfo",
              },
              "ContinuousIntegration": {
                  "Enabled": "False",
                  "UpdateRepository": "False",
              },
              "Packager": {
                  "UseCache": "True",
                  "CreateCache": "True",
                  "CacheDir": Path(
                      os.environ["CRAFT_BINARY_CACHE"]
                  ).as_posix(),
                  "PackageDebugSymbols": "False",
                  "DownloadDebugSymbolsCache": "False",
                  "PackageSrc": "False",
              },
          }

          for section, options in values.items():
              if not config.has_section(section):
                  config.add_section(section)
              for key, value in options.items():
                  config.set(section, key, value)

          with settings.open("w", encoding="utf-8") as handle:
              config.write(handle)

          print(f"Craft ABI: {actual}")
          print("Build type: RelWithDebInfo")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw 'Craft configuration failed.'
          }

      - name: Register Wunjo Craft blueprints
        run: |
          python "$env:GITHUB_WORKSPACE\portable\packaging\craft\register-blueprint.py"

          if ($LASTEXITCODE -ne 0) {
            throw 'Wunjo blueprint registration failed.'
          }

      - name: Install every Wunjo dependency
        run: |
          $ErrorActionPreference = 'Stop'
          function Clear-Host {}

          & "$env:CRAFT_ROOT\craft\craftenv.ps1"

          craft `
            --ci-mode `
            --use-cache `
            --create-cache `
            --install-deps `
            --options "wunjo.srcDir=$env:GITHUB_WORKSPACE\portable" `
            wunjo

          if ($LASTEXITCODE -ne 0) {
            throw 'Wunjo dependency installation failed.'
          }

      - name: Record installed dependency state
        run: |
          $ErrorActionPreference = 'Stop'
          function Clear-Host {}

          & "$env:CRAFT_ROOT\craft\craftenv.ps1"

          craft --ci-mode --shelve "$env:CRAFT_SHELF"
          if ($LASTEXITCODE -ne 0) {
            throw 'Craft shelf creation failed.'
          }

          craft --ci-mode --print-installed |
            Set-Content "$env:GITHUB_WORKSPACE\installed-packages.txt" `
              -Encoding utf8

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list installed Craft packages.'
          }

          if (-not (Test-Path -LiteralPath $env:CRAFT_SHELF)) {
            throw 'Craft shelf was not created.'
          }

          Get-Content $env:CRAFT_SHELF

      - name: Report supplemental Craft cache
        run: |
          $ErrorActionPreference = 'Stop'

          $archives = @(
            Get-ChildItem -LiteralPath $env:CRAFT_BINARY_CACHE `
              -Recurse -File -Filter '*.7z'
          )

          $manifests = @(
            Get-ChildItem -LiteralPath $env:CRAFT_BINARY_CACHE `
              -Recurse -File -Filter manifest.json
          )

          Write-Host "Supplemental archives: $($archives.Count)"
          Write-Host "Supplemental manifests: $($manifests.Count)"

          # A complete installed SDK does not require a nonempty
          # supplemental cache when dependencies came from KDE.
          if ($archives.Count -eq 0) {
            Write-Host 'No supplemental binary archives were produced.'
          } elseif ($manifests.Count -eq 0) {
            throw 'Supplemental archives exist but no manifest was produced.'
          }

      - name: Remove workspace-specific export settings
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          import configparser
          import os
          from pathlib import Path

          settings = Path(os.environ["CRAFT_ROOT"]) / "etc/CraftSettings.ini"
          config = configparser.RawConfigParser()
          config.optionxform = str
          with settings.open(encoding="utf-8-sig") as handle:
              config.read_file(handle)

          if config.has_section("Blueprints"):
              config.remove_option("Blueprints", "Locations")

          if config.has_section("Packager"):
              config.remove_option("Packager", "CacheDir")
              config.set("Packager", "CreateCache", "False")

          config.set("Compile", "BuildType", "RelWithDebInfo")
          config.set("ContinuousIntegration", "Enabled", "False")

          with settings.open("w", encoding="utf-8") as handle:
              config.write(handle)
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw 'SDK export settings update failed.'
          }

      - name: Validate SDK without MSYS
        run: |
          $ErrorActionPreference = 'Stop'

          $msys = Join-Path $env:CRAFT_ROOT 'msys'
          $savedMsys = Join-Path $env:RUNNER_TEMP 'craft-msys-ci-only'

          if (Test-Path -LiteralPath $savedMsys) {
            throw "Unexpected existing MSYS backup: $savedMsys"
          }

          if (Test-Path -LiteralPath $msys) {
            Move-Item -LiteralPath $msys -Destination $savedMsys
          }

          try {
            function Clear-Host {}
            & "$env:CRAFT_ROOT\craft\craftenv.ps1"

            cmake --version
            if ($LASTEXITCODE -ne 0) {
              throw 'CMake is unavailable.'
            }

            ninja --version
            if ($LASTEXITCODE -ne 0) {
              throw 'Ninja is unavailable.'
            }

            $cl = Get-Command cl.exe -ErrorAction Stop
            Write-Host "MSVC: $($cl.Source)"

            # Check development files, not just runtime DLLs.
            foreach ($component in 'avformat', 'avcodec', 'swresample', 'avutil') {
              $header = Join-Path $env:CRAFT_ROOT `
                "include\lib$component\$component.h"
              $library = Join-Path $env:CRAFT_ROOT "lib\$component.lib"

              if (-not (Test-Path -LiteralPath $header -PathType Leaf)) {
                throw "Missing FFmpeg development header: $header"
              }
              if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
                throw "Missing FFmpeg MSVC import library: $library"
              }

              Write-Host "FFmpeg header: $header"
              Write-Host "FFmpeg library: $library"
            }

            $configureDir = Join-Path $env:RUNNER_TEMP `
              'wunjo-sdk-configure-test'
            $prefix = $env:CRAFT_ROOT.Replace('\', '/')

            # Match Craft's CMake search and compiler-include settings.
            $arguments = @(
              '--fresh'
              '-S', "$env:GITHUB_WORKSPACE\portable"
              '-B', $configureDir
              '-G', 'Ninja'
              "-DCMAKE_PREFIX_PATH:PATH=$prefix"
              "-DCMAKE_INSTALL_PREFIX:PATH=$prefix"
              "-DCMAKE_REQUIRED_INCLUDES:STRING=$prefix/include"
              "-DCMAKE_C_STANDARD_INCLUDE_DIRECTORIES:STRING=$prefix/include"
              '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
              '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
              '-DCMAKE_INSTALL_SYSTEM_RUNTIME_LIBS_SKIP=ON'
              '-DKDE_INSTALL_USE_QT_SYS_PATHS=ON'
              '-DBUILD_SHARED_LIBS=ON'
              '-DBUILD_TESTING=OFF'
              '-DRELEASE_BUILD=OFF'
            )

            cmake @arguments
            if ($LASTEXITCODE -ne 0) {
              throw 'Wunjo CMake configuration failed without MSYS.'
            }

            Write-Host 'Wunjo configured successfully without MSYS.'
          } catch {
            if (
              (Test-Path -LiteralPath $savedMsys) -and
              (-not (Test-Path -LiteralPath $msys))
            ) {
              Move-Item -LiteralPath $savedMsys -Destination $msys
            }
            throw
          }

      - name: Preflight SDK and create exact archive file list
        run: |
          $ErrorActionPreference = 'Stop'

          $root = [IO.Path]::GetFullPath($env:CRAFT_ROOT)
          $parent = Split-Path $root -Parent

          $excluded = @(
            'build'
            'download'
            'logs'
            'tmp'
            'msys'
            'craft\.git'
            'etc\blueprints\locations\craft-blueprints-kde\.git'
          )

          $pending = [Collections.Generic.Stack[string]]::new()
          $files = [Collections.Generic.List[string]]::new()
          $pending.Push($root)
          [long]$bytes = 0

          while ($pending.Count -gt 0) {
            $directory = $pending.Pop()

            foreach ($item in Get-ChildItem -LiteralPath $directory -Force) {
              $relative = [IO.Path]::GetRelativePath($root, $item.FullName)

              # Prune before traversal, not after recursive enumeration.
              if ($relative -in $excluded) {
                continue
              }
              if (-not $item.PSIsContainer -and $item.Extension -eq '.pdb') {
                continue
              }

              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "Unexpected SDK reparse point: $($item.FullName)"
              }

              if ($item.PSIsContainer) {
                $pending.Push($item.FullName)
                continue
              }

              $stream = $null
              try {
                $stream = [IO.File]::Open(
                  $item.FullName,
                  [IO.FileMode]::Open,
                  [IO.FileAccess]::Read,
                  [IO.FileShare]::Read
                )
              } finally {
                if ($null -ne $stream) {
                  $stream.Dispose()
                }
              }

              $files.Add(
                [IO.Path]::GetRelativePath($parent, $item.FullName)
              )
              $bytes += $item.Length
            }
          }

          if ($files.Count -eq 0) {
            throw 'No SDK files were selected.'
          }

          $fileList = Join-Path $env:RUNNER_TEMP 'sdk-files.txt'
          [IO.File]::WriteAllLines(
            $fileList,
            $files,
            [Text.UTF8Encoding]::new($false)
          )

          Write-Host "Archive files: $($files.Count)"
          Write-Host ("Selected size: {0:N2} GiB" -f ($bytes / 1GB))

      - name: Create and test installed SDK archive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $sevenZip = "$env:CRAFT_ROOT\dev-utils\bin\7za.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }

          $archive = Join-Path $env:RUNNER_TEMP `
            'wunjo-dev-sdk-msvc2022-x64.7z'
          $fileList = Join-Path $env:RUNNER_TEMP 'sdk-files.txt'

          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }

          # File-list entries start with CraftRoot\, so extract to C:\.
          Push-Location (Split-Path $env:CRAFT_ROOT -Parent)
          try {
            & $sevenZip a -t7z -mx=9 -mmt=on -scsUTF-8 `
              $archive "@$fileList"
            $archiveExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          # Warning exit code 1 can mean skipped files; reject it.
          if ($archiveExit -ne 0) {
            throw "7-Zip archive creation failed: exit $archiveExit"
          }

          & $sevenZip t $archive
          if ($LASTEXITCODE -ne 0) {
            throw 'SDK archive integrity test failed.'
          }

          $hash = Get-FileHash -LiteralPath $archive -Algorithm SHA256
          $archiveBytes = (Get-Item -LiteralPath $archive).Length

          "$($hash.Hash)  $([IO.Path]::GetFileName($archive))" |
            Set-Content "$archive.sha256" -Encoding ascii

          @{
            abi = $env:CRAFT_ABI
            buildType = 'RelWithDebInfo'
            wunjoCommit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            createdUtc = [DateTime]::UtcNow.ToString('o')
            archive = [IO.Path]::GetFileName($archive)
            archiveBytes = $archiveBytes
            sha256 = $hash.Hash
            extractTo = 'C:\'
            installedPrefix = $env:CRAFT_ROOT
            validation = 'CMake configuration without MSYS; no application build'
            excluded = @(
              'build'
              'download'
              'logs'
              'tmp'
              'msys'
              'dependency PDBs'
              'Craft git history'
              'Craft blueprint git history'
            )
          } | ConvertTo-Json -Depth 4 |
            Set-Content "$env:GITHUB_WORKSPACE\sdk-info.json" -Encoding utf8

          Write-Host ("SDK archive: {0:N2} GiB" -f ($archiveBytes / 1GB))
          Write-Host "SHA256: $($hash.Hash)"

      - name: Write local setup instructions
        run: |
          @'
          Wunjo Windows development SDK
          =============================

          Prerequisites
          -------------
          Install Visual Studio 2022 or Build Tools 2022 with:
            - Desktop development with C++
            - MSVC x64/x86 build tools
            - Windows SDK

          Install Python 3.13, PowerShell 7, and Git.
          MSVC and the Windows SDK are not included in this archive.

          1. Extract
          ----------
          Extract wunjo-dev-sdk-msvc2022-x64.7z directly to C:\.

          Confirm:
            C:\CraftRoot\craft\craftenv.ps1
            C:\CraftRoot\include
            C:\CraftRoot\lib
            C:\CraftRoot\bin
            C:\CraftRoot\dev-utils

          Use C:\CraftRoot. This export is not validated for relocation
          to another drive or prefix.

          2. Update Craft's Python location
          --------------------------------
          CraftSettings.ini can contain the GitHub runner's Python path.
          Run this from PowerShell using your local Python installation:

          @"
          import configparser
          import sys
          from pathlib import Path

          settings = Path(r"C:\CraftRoot\etc\CraftSettings.ini")
          config = configparser.RawConfigParser()
          config.optionxform = str
          with settings.open(encoding="utf-8-sig") as handle:
              config.read_file(handle)
          if not config.has_section("Paths"):
              config.add_section("Paths")
          config.set("Paths", "Python", str(Path(sys.executable).parent))
          with settings.open("w", encoding="utf-8") as handle:
              config.write(handle)
          "@ | python -

          3. Clone your Wunjo fork
          -----------------------
          git clone https://github.com/kevinn-s/wunjo.wladradchenko.ru.git wunjo
          Set-Location .\wunjo

          Use the commit recorded in sdk-info.json when first validating
          the SDK. Later source revisions may require new dependencies.

          4. Load Craft and configure
          ---------------------------
          Save the repository path before craftenv.ps1 changes directory:

          $repo = (Get-Location).Path
          function Clear-Host {}
          & C:\CraftRoot\craft\craftenv.ps1

          cmake `
            -S "$repo\portable" `
            -B "$repo\build-windows" `
            -G Ninja `
            "-DCMAKE_PREFIX_PATH:PATH=C:/CraftRoot" `
            "-DCMAKE_INSTALL_PREFIX:PATH=C:/CraftRoot" `
            "-DCMAKE_REQUIRED_INCLUDES:STRING=C:/CraftRoot/include" `
            "-DCMAKE_C_STANDARD_INCLUDE_DIRECTORIES:STRING=C:/CraftRoot/include" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_INSTALL_SYSTEM_RUNTIME_LIBS_SKIP=ON `
            -DKDE_INSTALL_USE_QT_SYS_PATHS=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=OFF `
            -DRELEASE_BUILD=OFF

          If reusing a build directory from a failed configuration,
          add --fresh to the cmake configure command.

          5. Build Wunjo
          --------------
          cmake --build "$repo\build-windows" --parallel 2

          Repeat the build command after editing application source.
          Load the Craft environment again in each new shell.

          Dependencies are already installed. Normal application builds
          should not require craft --install-deps.

          Validation scope
          ----------------
          CI configured Wunjo with MSYS removed and with Craft's dependency
          search prefix supplied explicitly. It did not compile or run Wunjo.

          MSYS is omitted. Rebuilding dependencies that use Autotools may
          require installing MSYS again.

          The shelf records installed package versions. It is metadata,
          not a guarantee that every historical source or binary remains
          available from upstream.
          '@ | Set-Content "$env:GITHUB_WORKSPACE\LOCAL_SETUP.txt" `
            -Encoding utf8

      - name: Report disk space
        if: always()
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Upload complete local-development SDK
        uses: actions/upload-artifact@v4
        with:
          name: wunjo-dev-sdk-msvc2022-x64
          path: |
            ${{ runner.temp }}/wunjo-dev-sdk-msvc2022-x64.7z
            ${{ runner.temp }}/wunjo-dev-sdk-msvc2022-x64.7z.sha256
            wunjo-windows.craft.shelf
            installed-packages.txt
            sdk-info.json
            LOCAL_SETUP.txt
            craft-binary-cache/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
